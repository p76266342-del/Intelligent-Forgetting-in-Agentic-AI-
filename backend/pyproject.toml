[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-forgetting"
version = "0.1.0"
description = "Intelligent Forgetting in Agentic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "streamlit>=1.32.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.pyrefly]
extraPaths = ["src"]
