services:
  # ==============================================================================
  # BACKEND SERVICE (FastAPI Python 3.11+ REST API)
  # ==============================================================================
  - type: web
    name: intelligent-forgetting-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && pip install -e backend"
    startCommand: "uvicorn intelligent_forgetting.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: intelligent-forgetting-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://intelligent-forgetting-frontend.onrender.com,http://intelligent-forgetting-frontend.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: intelligent_forgetting_memories
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  # ==============================================================================
  # FRONTEND SERVICE (Next.js 16 App Router Web Service)
  # ==============================================================================
  - type: web
    name: intelligent-forgetting-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: intelligent-forgetting-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: intelligent-forgetting-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false

# ==============================================================================
# MANAGED DATABASE (PostgreSQL for Persistent Production Memory Store)
# ==============================================================================
databases:
  - name: intelligent-forgetting-db
    databaseName: intelligent_forgetting
    user: forgetting_user
    region: oregon
    plan: free
