services:
  # ==============================================================================
  # BACKEND SERVICE (Python FastAPI REST API)
  # ==============================================================================
  - type: web
    name: intelligent-forgetting-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && pip install -e backend"
    startCommand: "uvicorn intelligent_forgetting.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: intelligent_forgetting_memories
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: DATABASE_PATH
        value: data/memories.db
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: intelligent-forgetting-frontend
          property: host

  # ==============================================================================
  # FRONTEND SERVICE (Next.js App Router Web Service)
  # ==============================================================================
  - type: web
    name: intelligent-forgetting-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: intelligent-forgetting-backend
          property: host
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
